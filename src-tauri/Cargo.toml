[package]
name = "neko"
version = "0.1.3"
description = "A desktop break reminder"
edition = "2024"

[lib]
name = "neko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
parking_lot = "0.12"
rodio = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sys-locale = "0.3"
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
# "log" forwards tracing events to the `log` facade so tauri-plugin-log
# persists them (no tracing subscriber is installed).
tracing = { version = "0.1", features = ["log"] }
user-idle2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_RemoteDesktop",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSGraphics", "NSPanel", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSObject"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = "debuginfo"
